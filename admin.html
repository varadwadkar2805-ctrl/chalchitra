<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chalchitra Admin</title>
<style>
  :root { --ink:#17141f; --surface:#231f31; --paper:#f2ede4; --muted:#a39cb5; --rose:#e8456b; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--ink); color: var(--paper); font-family: system-ui, sans-serif; line-height: 1.5; padding: 20px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 16px; }
  h2 { font-size: 1.15rem; margin: 28px 0 10px; }
  label { display: block; margin-top: 14px; color: var(--muted); font-size: .9rem; }
  input, textarea, button { width: 100%; font: inherit; color: var(--paper); background: var(--surface); border: 2px solid transparent; border-radius: 10px; padding: 12px 14px; margin-top: 6px; }
  input:focus, textarea:focus { outline: none; border-color: var(--rose); }
  textarea { min-height: 80px; resize: vertical; }
  button { background: var(--rose); color: #fff; font-weight: 600; cursor: pointer; margin-top: 18px; }
  button:disabled { opacity: .5; }
  button.small { width: auto; padding: 6px 12px; margin: 0; background: #5a2434; font-size: .85rem; }
  .bar { height: 8px; background: var(--surface); border-radius: 6px; margin-top: 8px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--rose); transition: width .2s; }
  #msg { margin-top: 14px; min-height: 1.4em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border-radius: 10px; padding: 10px 14px; margin-top: 8px; }
  .hide { display: none; }
</style>
</head>
<body>
<h1>Chalchitra Admin</h1>

<section id="login">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <button id="loginBtn">Login</button>
  <p id="loginMsg"></p>
</section>

<section id="panel" class="hide">
  <h2>Nayi movie jodo</h2>
  <label for="title">Movie ka naam</label>
  <input id="title">
  <label for="year">Saal</label>
  <input id="year" type="number" inputmode="numeric" placeholder="2024">
  <label for="genre">Genre</label>
  <input id="genre" placeholder="Drama">
  <label for="desc">Chhoti kahani</label>
  <textarea id="desc"></textarea>
  <label for="poster">Poster (image file, optional)</label>
  <input id="poster" type="file" accept="image/*">
  <label for="video">Movie ki video (.mp4)</label>
  <input id="video" type="file" accept="video/mp4,video/webm">
  <div class="bar"><i id="prog"></i></div>
  <button id="addBtn">Upload karke jodo</button>
  <p id="msg" role="status"></p>

  <h2>Site par abhi ki movies</h2>
  <div id="list"></div>
</section>

<script type="module">
import { upload } from "https://esm.sh/@vercel/blob@1/client";

const $ = (id) => document.getElementById(id);
let password = sessionStorage.getItem("pw") || "";

async function api(body) {
  const res = await fetch("/api/movies", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password, ...body }),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Error");
  return data;
}

function renderList(movies) {
  const box = $("list");
  box.innerHTML = "";
  if (!movies.length) { box.textContent = "Abhi koi movie nahi hai."; return; }
  for (const m of movies) {
    const row = document.createElement("div");
    row.className = "row";
    const name = document.createElement("span");
    name.textContent = m.title;
    const del = document.createElement("button");
    del.className = "small";
    del.textContent = "Hatao";
    del.onclick = async () => {
      if (!confirm(m.title + " hata dein?")) return;
      del.disabled = true;
      try { renderList(await api({ action: "delete", id: m.id })); }
      catch (e) { $("msg").textContent = e.message; del.disabled = false; }
    };
    row.append(name, del);
    box.append(row);
  }
}

async function enter() {
  try {
    await api({ action: "check" });
    sessionStorage.setItem("pw", password);
    $("login").classList.add("hide");
    $("panel").classList.remove("hide");
    const r = await fetch("/api/movies");
    renderList(await r.json());
  } catch (e) {
    sessionStorage.removeItem("pw");
    $("loginMsg").textContent = e.message;
  }
}

$("loginBtn").onclick = () => { password = $("pw").value; enter(); };
if (password) enter();

$("addBtn").onclick = async () => {
  const title = $("title").value.trim();
  const videoFile = $("video").files[0];
  const posterFile = $("poster").files[0];
  if (!title || !videoFile) { $("msg").textContent = "Naam aur video file chuno."; return; }

  const btn = $("addBtn");
  btn.disabled = true;
  $("prog").style.width = "0";
  try {
    let poster = "";
    if (posterFile) {
      $("msg").textContent = "Poster upload ho raha hai…";
      const p = await upload(posterFile.name, posterFile, {
        access: "public", handleUploadUrl: "/api/upload", clientPayload: password,
      });
      poster = p.url;
    }
    $("msg").textContent = "Video upload ho raha hai. Ye page band mat karna.";
    const v = await upload(videoFile.name, videoFile, {
      access: "public", handleUploadUrl: "/api/upload", clientPayload: password, multipart: true,
      onUploadProgress: ({ percentage }) => { $("prog").style.width = percentage + "%"; },
    });
    const list = await api({
      action: "add",
      movie: {
        title, poster, video_url: v.url,
        year: $("year").value, genre: $("genre").value.trim(), description: $("desc").value.trim(),
      },
    });
    renderList(list);
    $("msg").textContent = "Movie site par jud gayi.";
    ["title", "year", "genre", "desc", "poster", "video"].forEach((id) => ($(id).value = ""));
    $("prog").style.width = "0";
  } catch (e) {
    $("msg").textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
